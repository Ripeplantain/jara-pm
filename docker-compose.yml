services:
  app:
    build:
      context: .
      target: dev
    env_file: .env
    environment:
      NUXT_DATABASE_PATH: ${NUXT_DATABASE_PATH:-/data/kobi.db}
      NUXT_SESSION_PASSWORD: ${NUXT_SESSION_PASSWORD:-}
      NUXT_LLM_API_KEY: ${NUXT_LLM_API_KEY:-}
      NUXT_LLM_BASE_URL: ${NUXT_LLM_BASE_URL:-https://openrouter.ai/api/v1}
      NUXT_LLM_MODEL: ${NUXT_LLM_MODEL:-deepseek/deepseek-v4.1-flash}
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - kobi-nuxt:/app/.nuxt
      - kobi-output:/app/.output
      - kobi-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  kobi-data:
  kobi-nuxt:
  kobi-output:
