services:
  app:
    build:
      target: prod
    image: jara-pm-nuxt:prod
    env_file: !reset []
    environment:
      NUXT_DATABASE_PATH: ${NUXT_DATABASE_PATH:-/data/kobi.db}
      NUXT_SESSION_PASSWORD: ${NUXT_SESSION_PASSWORD:?set NUXT_SESSION_PASSWORD in .env}
      NUXT_LLM_API_KEY: ${NUXT_LLM_API_KEY:-}
      NUXT_LLM_BASE_URL: ${NUXT_LLM_BASE_URL:-https://openrouter.ai/api/v1}
      NUXT_LLM_MODEL: ${NUXT_LLM_MODEL:-deepseek/deepseek-v4.1-flash}
    ports: !override
      - "127.0.0.1:3000:3000"
    volumes: !override
      - kobi-data:/data
    restart: unless-stopped
