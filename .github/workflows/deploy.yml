name: Verify and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kobi-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
      NUXT_SESSION_PASSWORD: ci-only-session-password-at-least-thirty-two-characters

    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Create CI environment
        run: cp .env.example .env

      - name: Validate Compose configuration
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet

      - name: Run verification
        run: ./scripts/verify.sh

      - name: Build production image
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml build app

      - name: Smoke test production image
        run: |
          docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --wait --wait-timeout 120 app
          curl --fail --retry 10 --retry-delay 2 http://127.0.0.1:3000/api/health

      - name: Clean up CI containers
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml down

  deploy:
    name: Deploy to production
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519"
          chmod 644 "$HOME/.ssh/known_hosts"

      - name: Sync application source
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          rsync -az --delete \
            --exclude='.env*' \
            --exclude='.git/' \
            --exclude='node_modules/' \
            --exclude='.nuxt/' \
            --exclude='.output/' \
            --exclude='data/' \
            ./ "${VPS_USER}@${VPS_HOST}:/opt/kobi/"

      - name: Rebuild and restart production
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh "${VPS_USER}@${VPS_HOST}" 'bash -se' <<'REMOTE'
          set -euo pipefail
          cd /opt/kobi
          docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.prod.yml up --build -d --wait --wait-timeout 120 app
          docker compose -f docker-compose.yml -f docker-compose.prod.yml ps
          REMOTE
